<text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e5e5e5" text-anchor="start" letter-spacing="0.5px">CASTING RECOMMENDATION — REQUEST SEQUENCE</text>
<text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8c8c8c" text-anchor="start">The same shape as contract-ingest and compliance-memo: direct SQL + AI Functions, no agent involved — 7 sequential round-trips collapsed into 4 concurrent stages</text>
<rect x="30" y="110" width="220" height="44" rx="8" fill="#1f1f1f" stroke="#3a7bd5" stroke-width="1.8"/>
<text x="140" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e5e5e5" text-anchor="middle">Browser</text>
<line x1="140" y1="154" x2="140" y2="930" stroke="#333333" stroke-width="1.3" stroke-dasharray="4,4"/>
<rect x="450" y="110" width="220" height="44" rx="8" fill="#1f1f1f" stroke="#E50914" stroke-width="1.8"/>
<text x="560" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e5e5e5" text-anchor="middle">Next.js backend</text>
